<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Appointments{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { border-bottom: 3px solid #0b5; padding-bottom: .3rem; }
    a { color: #075; }
    nav { margin-bottom: 1.2rem; display: flex; gap: 1.2rem; }
    ul { padding-left: 1.2rem; }
    li { margin: .5rem 0; }
    .meta { color: #666; font-size: .9rem; }
    dt { font-weight: 600; margin-top: .8rem; }
    dd { margin: 0; }
    .badge { padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
    .badge-scheduled { background: #dff5e8; color: #0b6b3a; }
    .badge-completed { background: #dce9fb; color: #1b4f9c; }
    .badge-cancelled { background: #fbe0e0; color: #a12b2b; }
    .form-card { background: #fff; border: 1px solid #e3e8e6; border-radius: 12px; padding: 24px 28px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; }
    .form-control { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 1rem; font-family: inherit; border: 1.5px solid #cfd8d4; border-radius: 8px; background: #fafcfb; }
    .form-control:focus { outline: none; border-color: #1aa660; box-shadow: 0 0 0 3px rgba(26,166,96,.18); }
    .error { color: #d64545; font-size: .875rem; margin-top: 5px; }
    .btn { background: #1aa660; color: #fff; border: none; padding: 10px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-danger { background: #d64545; }
    .actions { display: flex; align-items: center; gap: 16px; margin-top: 22px; }
  </style>
</head>
<body>
  <h1>Appointment Booking</h1>
  <nav>
    <a href="{% url 'appointments:appointment_list' %}">All appointments</a>
    <a href="{% url 'appointments:appointment_create' %}">+ New appointment</a>
    <a href="{% url 'admin:index' %}">Admin</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
