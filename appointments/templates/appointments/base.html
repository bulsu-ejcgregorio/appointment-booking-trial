{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Appointments{% endblock %} | Jamella Paws &amp; Friends</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FEFAF7',
            peach: '#FBE3D3',
            cocoa: { DEFAULT: '#7B5B45', dark: '#5E4332' },
            blush: { DEFAULT: '#F4B6AE', light: '#FCE4E0', dark: '#B84B3E' },
            sage: { DEFAULT: '#B3BB9A', light: '#E7EBDC', dark: '#4F5A36' },
          },
          fontFamily: {
            display: ['Fredoka', 'ui-rounded', 'system-ui', 'sans-serif'],
            sans: ['Nunito', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style type="text/tailwindcss">
    /* Shared pieces, used by every page */
    .form-control {
      @apply w-full rounded-2xl border-2 border-peach bg-white px-4 py-2.5 text-cocoa placeholder:text-cocoa/40 focus:border-blush focus:outline-none focus:ring-4 focus:ring-blush/30;
    }
    .btn {
      @apply inline-flex items-center justify-center rounded-full bg-blush-dark px-6 py-2.5 font-display font-medium text-white shadow-sm transition hover:bg-cocoa focus:outline-none focus-visible:ring-4 focus-visible:ring-blush;
    }
    .btn-soft {
      @apply inline-flex items-center justify-center rounded-full bg-peach px-6 py-2.5 font-display font-medium text-cocoa-dark transition hover:bg-blush-light focus:outline-none focus-visible:ring-4 focus-visible:ring-blush;
    }
    .badge { @apply inline-block rounded-full px-3 py-0.5 font-display text-sm font-medium; }
    .badge-scheduled { background: #E7EBDC; color: #4F5A36; }
    .badge-completed { background: #DCE9F2; color: #2F5575; }
    .badge-cancelled { background: #FCE4E0; color: #9C3A2F; }
    .badge-archived  { background: #EEE8E2; color: #6B5B4E; }
    .field-error { @apply mt-1 text-sm font-semibold text-blush-dark; }
  </style>
</head>
<body class="min-h-screen bg-cream font-sans text-cocoa antialiased">

  <header class="border-b-2 border-peach">
    <div class="mx-auto flex max-w-4xl flex-col items-center gap-2 px-4 py-3 sm:flex-row sm:justify-between">
      <a href="{% url 'appointments:appointment_list' %}" class="shrink-0">
        <img src="{% static 'appointments/logo.png' %}"
             alt="Jamella Paws &amp; Friends, Veterinary &amp; Grooming Center"
             class="h-24 w-auto sm:h-28">
      </a>
      {% with current=request.resolver_match.url_name %}
      <nav class="flex flex-wrap items-center justify-center gap-1 font-display" aria-label="Main">
        <a href="{% url 'appointments:appointment_list' %}"
           {% if current == 'appointment_list' or current == 'appointment_detail' %}aria-current="page"{% endif %}
           class="rounded-full px-4 py-2 font-medium transition hover:bg-peach {% if current == 'appointment_list' or current == 'appointment_detail' %}bg-peach text-cocoa-dark{% endif %}">All Appointments</a>
        <a href="{% url 'appointments:appointment_create' %}"
           {% if current == 'appointment_create' %}aria-current="page"{% endif %}
           class="rounded-full px-4 py-2 font-medium transition hover:bg-peach {% if current == 'appointment_create' %}bg-peach text-cocoa-dark{% endif %}">New Appointment</a>
        <a href="{% url 'admin:index' %}"
           class="rounded-full px-4 py-2 font-medium transition hover:bg-peach">Admin</a>
      </nav>
      {% endwith %}
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="pb-8 text-center text-sm text-cocoa/70">
    Jamella Paws &amp; Friends, Veterinary &amp; Grooming Center
  </footer>

</body>
</html>
