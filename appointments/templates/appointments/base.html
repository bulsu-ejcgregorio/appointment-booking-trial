{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Appointments{% endblock %} | Jamella Paws &amp; Friends</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FEFAF7',
            peach: '#FBE3D3',
            cocoa: { DEFAULT: '#7B5B45', dark: '#5E4332' },
            blush: { DEFAULT: '#F4B6AE', light: '#FCE4E0', dark: '#B84B3E' },
            sage: { DEFAULT: '#B3BB9A', light: '#E7EBDC', dark: '#4F5A36' },
          },
          fontFamily: {
            display: ['Fredoka', 'ui-rounded', 'system-ui', 'sans-serif'],
            sans: ['Nunito', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style type="text/tailwindcss">
    /* Shared pieces, used by every page */
    .form-control {
      @apply w-full rounded-xl border border-peach bg-white px-4 py-2.5 text-cocoa placeholder:text-cocoa/40 transition focus:border-blush focus:outline-none focus:ring-4 focus:ring-blush/25;
    }
    .btn {
      @apply inline-flex items-center justify-center rounded-full bg-blush-dark px-6 py-2.5 font-display text-[0.95rem] font-medium text-white transition hover:bg-cocoa focus:outline-none focus-visible:ring-4 focus-visible:ring-blush;
    }
    .btn-soft {
      @apply inline-flex items-center justify-center rounded-full border border-cocoa/25 px-6 py-2.5 font-display text-[0.95rem] font-medium text-cocoa-dark transition hover:bg-peach/60 focus:outline-none focus-visible:ring-4 focus-visible:ring-blush;
    }
    .badge { @apply inline-block rounded-full px-3 py-0.5 font-display text-sm font-medium; }
    .badge-scheduled { background: #E7EBDC; color: #4F5A36; }
    .badge-completed { background: #DCE9F2; color: #2F5575; }
    .badge-cancelled { background: #FCE4E0; color: #9C3A2F; }
    .badge-archived  { background: #EEE8E2; color: #6B5B4E; }
    .field-error { @apply mt-1 text-sm font-semibold text-blush-dark; }
  </style>
</head>
<body class="min-h-screen bg-cream font-sans text-cocoa antialiased">

  <svg width="0" height="0" class="absolute" aria-hidden="true">
      <symbol id="paw" viewBox="0 0 64 64">
        <path d="M32 31c-7 0-13 6-13 12 0 4 3 7 7 7 2 0 4-1 6-1s4 1 6 1c4 0 7-3 7-7 0-6-6-12-13-12z"/>
        <ellipse cx="19" cy="28" rx="4.2" ry="5.4" transform="rotate(-20 19 28)"/>
        <ellipse cx="27" cy="20" rx="4.2" ry="5.8" transform="rotate(-6 27 20)"/>
        <ellipse cx="37" cy="20" rx="4.2" ry="5.8" transform="rotate(6 37 20)"/>
        <ellipse cx="45" cy="28" rx="4.2" ry="5.4" transform="rotate(20 45 28)"/>
      </symbol>
    </svg>

  <!-- Decorative paw trails: faint, in the side margins, wide screens only -->
  <div class="pointer-events-none fixed inset-0 -z-10 hidden overflow-hidden min-[1000px]:block" aria-hidden="true">
    <svg viewBox="0 0 100 290" class="absolute left-1.5 top-44 w-10 fill-current text-blush opacity-40 min-[1180px]:left-10 min-[1180px]:w-24 min-[1180px]:opacity-30">
      <use href="#paw" x="6"  y="0"   width="40" height="40" transform="rotate(-15 26 20)"/>
      <use href="#paw" x="52" y="55"  width="40" height="40" transform="rotate(10 72 75)"/>
      <use href="#paw" x="6"  y="115" width="40" height="40" transform="rotate(-15 26 135)"/>
      <use href="#paw" x="52" y="170" width="40" height="40" transform="rotate(10 72 190)"/>
      <use href="#paw" x="6"  y="230" width="40" height="40" transform="rotate(-15 26 250)"/>
    </svg>
    <svg viewBox="0 0 100 290" class="absolute bottom-24 right-1.5 w-10 fill-current text-sage opacity-50 min-[1180px]:right-10 min-[1180px]:w-24 min-[1180px]:opacity-40">
      <use href="#paw" x="52" y="0"   width="40" height="40" transform="rotate(15 72 20)"/>
      <use href="#paw" x="6"  y="55"  width="40" height="40" transform="rotate(-10 26 75)"/>
      <use href="#paw" x="52" y="115" width="40" height="40" transform="rotate(15 72 135)"/>
      <use href="#paw" x="6"  y="170" width="40" height="40" transform="rotate(-10 26 190)"/>
      <use href="#paw" x="52" y="230" width="40" height="40" transform="rotate(15 72 250)"/>
    </svg>
  </div>

  <header class="border-b border-peach">
    <div class="mx-auto flex max-w-4xl flex-col items-center gap-3 px-4 py-4 sm:flex-row sm:justify-between">
      <a href="{% url 'appointments:appointment_list' %}" class="shrink-0">
        <img src="{% static 'appointments/logo.png' %}"
             alt="Jamella Paws &amp; Friends, Veterinary &amp; Grooming Center"
             class="h-24 w-auto sm:h-28">
      </a>
      {% with current=request.resolver_match.url_name %}
      <nav class="flex flex-wrap items-center justify-center gap-x-2 font-display" aria-label="Main">
        <a href="{% url 'appointments:appointment_list' %}"
           {% if current == 'appointment_list' or current == 'appointment_detail' %}aria-current="page"{% endif %}
           class="relative px-3 py-2 font-medium transition hover:text-cocoa-dark {% if current == 'appointment_list' or current == 'appointment_detail' %}text-cocoa-dark after:absolute after:inset-x-3 after:bottom-0 after:h-0.5 after:rounded-full after:bg-blush-dark{% else %}text-cocoa/75{% endif %}">All Appointments</a>
        <a href="{% url 'appointments:appointment_create' %}"
           {% if current == 'appointment_create' %}aria-current="page"{% endif %}
           class="relative px-3 py-2 font-medium transition hover:text-cocoa-dark {% if current == 'appointment_create' %}text-cocoa-dark after:absolute after:inset-x-3 after:bottom-0 after:h-0.5 after:rounded-full after:bg-blush-dark{% else %}text-cocoa/75{% endif %}">New Appointment</a>
        <a href="{% url 'admin:index' %}"
           class="relative px-3 py-2 font-medium text-cocoa/75 transition hover:text-cocoa-dark">Admin</a>
      </nav>
      {% endwith %}
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-4xl border-t border-peach px-4 py-6 text-center text-sm text-cocoa/60">
    <div class="mb-3 flex items-center justify-center gap-3 fill-current text-blush" aria-hidden="true">
      <svg class="h-5 w-5 -rotate-12 opacity-60"><use href="#paw"/></svg>
      <svg class="h-6 w-6 opacity-80"><use href="#paw"/></svg>
      <svg class="h-5 w-5 rotate-12 opacity-60"><use href="#paw"/></svg>
    </div>
    Jamella Paws &amp; Friends, Veterinary &amp; Grooming Center
  </footer>

</body>
</html>
