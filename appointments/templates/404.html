<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 – Page Not Found</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(56,189,248,.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(129,140,248,.15), transparent 40%),
        var(--bg);
    }
    .card {
      max-width: 680px;
      width: 100%;
      text-align: center;
      padding: 40px 32px 48px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }
    .code { animation: float 3s ease-in-out infinite; }
    .art {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 0 12px rgba(56,189,248,.45));
    }
    .art .hi { fill: #e0f2fe; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    h1 { margin: 12px 0 8px; font-size: 1.6rem; }
    p  { color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      color: #0f172a;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 20px rgba(56,189,248,.35);
    }
    .btn-ghost {
      color: var(--text);
      border: 1px solid rgba(255,255,255,.15);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.06); }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) { .code { animation: none; } }
    @media (forced-colors: active) { .art text { fill: CanvasText; } }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 28px 18px 36px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
